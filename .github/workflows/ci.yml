name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Cloudflare Pages project; created through the API on the first deploy if it does not exist.
  PROJETO_CLOUDFLARE: tazthedoctor

jobs:
  # One job on purpose (private repo, billed minutes): check, test, build and, when the
  # Cloudflare secrets exist, deploy the same dist/ (production on main, preview on PRs).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Page size
        run: du -sh dist && du -h dist/index.html

      # Forks and Dependabot get no secrets; without them the deploy is skipped with a warning.
      - name: Check Cloudflare secrets
        id: segredos
        env:
          ATOR: ${{ github.actor }}
          MESMO_REPO: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$ATOR" = "dependabot[bot]" ] || [ "$MESMO_REPO" != "true" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy (see README, Publicação)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch name for Cloudflare
        if: steps.segredos.outputs.ok == 'true'
        id: ramo
        env:
          RAMO: ${{ github.head_ref || github.ref_name }}
        # Cloudflare aliases previews by branch; keep only characters that are safe in a subdomain.
        run: echo "nome=$(printf '%s' "$RAMO" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"

      - name: Create the Pages project if missing
        if: steps.segredos.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJETO_CLOUDFLARE")
          if [ "$status" = 404 ]; then
            curl -sf -o /dev/null -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PROJETO_CLOUDFLARE\",\"production_branch\":\"main\"}"
            echo "Created Pages project $PROJETO_CLOUDFLARE"
          elif [ "$status" != 200 ]; then
            echo "::error::Cloudflare API returned HTTP $status for project $PROJETO_CLOUDFLARE (check the token permission: Account > Cloudflare Pages > Edit)"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.segredos.outputs.ok == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.154.0"
          command: pages deploy dist --project-name=${{ env.PROJETO_CLOUDFLARE }} --branch=${{ steps.ramo.outputs.nome }}

      - name: Summary
        if: steps.segredos.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "### $PROJETO_CLOUDFLARE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: $URL" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$ALIAS" ] && echo "- Branch alias: $ALIAS" >> "$GITHUB_STEP_SUMMARY" || true

  # Single, stable name for a required status check.
  ci-ok:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Build passed
        run: test "${{ needs.build.result }}" = success
