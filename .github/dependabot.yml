# Monthly and grouped: every Dependabot PR runs CI, and this private repo pays for its minutes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    assignees: ["thalesreiser"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Node types follow the runtime in .nvmrc (Node 24); bump them together with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check pins its TypeScript peer range; adopt a new major once it supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees: ["thalesreiser"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
